[workspace]
members = ["crates/x3f-render"]

[package]
name = "x3fuse-tauri"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
default-run = "x3fuse-tauri"

[lib]
name = "x3fuse_app"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
# Apply backgroundColor to WKWebView's backing surface during live resizing.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
percent-encoding = "2"
url = "2"
tempfile = "3"
sys-locale = "0.3"
x3f-core = { version = "0.1.5", path = "../../../x3fuse-core/crates/x3f-core" }
x3f-render = { path = "crates/x3f-render" }
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# RAW processing needs optimization even when the desktop app is being debugged.
[profile.dev.package.x3f-core]
opt-level = 3

[profile.dev.package.x3f-sys]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.x3f-render]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

# Preview PNG filtering must stay optimized in desktop debug builds.
[profile.dev.package.png]
opt-level = 3

# Importing saved edits fingerprints the entire RAW, including on external drives.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
