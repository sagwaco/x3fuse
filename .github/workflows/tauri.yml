name: Tauri desktop checks and artifacts

on:
  pull_request:
    paths: ["tauri/**", "X3Fuse/opcodes/**", ".github/workflows/tauri.yml"]
  push:
    paths: ["tauri/**", "X3Fuse/opcodes/**", ".github/workflows/tauri.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macos
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: x64
          - runner: windows-2022
            platform: windows
            arch: x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: tauri
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build and runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev perl
      - name: Locate Windows libclang
        if: runner.os == 'Windows'
        run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run sync:resources
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:frontend
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build macOS application bundle
        if: runner.os == 'macOS'
        run: npm run tauri -- build --bundles app
      - name: Build Windows or Linux native executable
        if: runner.os != 'macOS'
        run: npm run tauri -- build --no-bundle
      - name: Package executable and complete resources
        run: node scripts/package-artifact.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: x3fuse-tauri-${{ matrix.platform }}-${{ matrix.arch }}
          path: tauri/artifacts/*.tar.gz
          if-no-files-found: error
          compression-level: 0
