name: Tauri desktop checks and artifacts

on:
  pull_request:
    paths: ["tauri/**", "X3Fuse/opcodes/**", ".github/workflows/tauri.yml"]
  push:
    branches: ["**"]
    tags: ["tauri-v*-alpha.*"]
    paths: ["tauri/**", "X3Fuse/opcodes/**", ".github/workflows/tauri.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macos
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: x64
          - runner: windows-2022
            platform: windows
            arch: x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: tauri
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build and runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev perl
      - name: Locate Windows libclang
        if: runner.os == 'Windows'
        run: printf '%s\n' 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run sync:resources
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:frontend
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build macOS application bundle
        if: runner.os == 'macOS'
        run: npm run tauri -- build --bundles app
      - name: Build Windows or Linux native executable
        if: runner.os != 'macOS'
        run: npm run tauri -- build --no-bundle
      - name: Package executable and complete resources
        run: node scripts/package-artifact.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: x3fuse-tauri-${{ matrix.platform }}-${{ matrix.arch }}
          path: tauri/artifacts/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish-alpha:
    needs: native
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'tauri-v') && contains(github.ref_name, '-alpha.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: x3fuse-tauri-*
          path: artifacts
          merge-multiple: true
      - name: Publish alpha archives
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: X3Fuse Tauri ${{ github.ref_name }}
          draft: false
          prerelease: true
          make_latest: "false"
          fail_on_unmatched_files: true
          files: |
            artifacts/x3fuse-tauri-darwin-arm64.tar.gz
            artifacts/x3fuse-tauri-darwin-x64.tar.gz
            artifacts/x3fuse-tauri-win32-x64.tar.gz
            artifacts/x3fuse-tauri-linux-x64.tar.gz
          body: |
            Multiplatform alpha for user testing, built from commit `${{ github.sha }}`.

            Download the archive for your OS and architecture and keep the complete extracted directory together.
            macOS archives contain an app bundle; Windows and Linux archives contain a portable executable and resources.
            These builds are unsigned, are not notarized, and do not support automatic updates.

            macOS requires macOS 14 or newer and system Perl. Windows requires Microsoft WebView2 Runtime.
            Linux requires WebKitGTK 4.1, GTK 3, and Perl.

            [Launch instructions and testing checklist](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/tauri/README.md#checks-and-builds)
