name: "Create Release"

on:
  issue_comment:
    types: [created]

env:
  MACOSX_DEPLOYMENT_TARGET: "14.0"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: publish-release-${{ github.event.issue.pull_request != null && contains(github.event.comment.body, '/release') && 'release' || github.run_id }}
  cancel-in-progress: ${{ github.event.issue.pull_request != null && contains(github.event.comment.body, '/release') }}

jobs:
  preparation:
    name: Preparation job
    if: ${{ github.event.issue.pull_request != null && contains(github.event.comment.body, '/release') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check permissions
        uses: actions/github-script@v7
        with:
          script: |
            const commenter = context.payload.comment.user.login;
            const { data: { permission } } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: commenter,
            });

            if (permission !== 'admin' && permission !== 'write') {
              core.setFailed(`User ${commenter} does not have write permissions`);
            }

            console.log(`User ${commenter} has ${permission} permission`);

      - name: Add reactions
        uses: peter-evans/create-or-update-comment@v2
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: eyes

      - uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (pr.data.draft || pr.data.mergeable_state !== "clean") {
              core.setFailed("PR is not ready to be merged");
            }

      - uses: xt0rted/pull-request-comment-branch@v1
        id: comment-branch

      - uses: actions/checkout@v5
        if: success()
        with:
          ref: ${{ steps.comment-branch.outputs.head_ref }}

      - name: Extract latest changes
        id: latest_changes
        run: |
          bash ./Configuration/release.sh > release_info.txt

          # Extract values from the script output
          LATEST_VERSION=$(grep "Latest Version:" release_info.txt | cut -d' ' -f3)
          LATEST_TITLE=$(grep "Latest Title:" release_info.txt | cut -d' ' -f3- | sed 's/Latest Title: //')
          PREVIOUS_VERSION=$(grep "Previous Version:" release_info.txt | cut -d' ' -f3)

          # Extract release notes (everything after "Release Notes:")
          sed -n '/Release Notes:/,$p' release_info.txt | tail -n +2 > latest_changes

          echo "$LATEST_VERSION" > new_version
          echo "$LATEST_TITLE" > title

          echo "Latest Version: $LATEST_VERSION"
          echo "Latest Title: $LATEST_TITLE"
          echo "Previous Version: $PREVIOUS_VERSION"

      - name: Reject published release versions
        run: |
          LATEST_VERSION=$(cat new_version)
          existing_tag=$(git ls-remote --tags origin "refs/tags/v$LATEST_VERSION")
          if [ -n "$existing_tag" ]; then
            echo "ERROR: Release v$LATEST_VERSION already exists on origin."
            exit 1
          fi

      - name: Save generated info
        uses: actions/upload-artifact@v4
        with:
          path: |
            new_version
            title
            latest_changes

      - name: Clean up generated files for sync
        run: |
          rm -f latest_changes title new_version release_info.txt

      - name: Sync branch
        uses: devmasx/merge-branch@master
        with:
          type: now
          from_branch: ${{ steps.comment-branch.outputs.base_ref }}
          target_branch: ${{ steps.comment-branch.outputs.head_ref }}
          github_token: ${{ github.token }}

  archive:
    name: Build and export app
    runs-on: macos-26
    needs: preparation
    steps:
      - uses: xt0rted/pull-request-comment-branch@v1
        id: comment-branch

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.comment-branch.outputs.head_ref }}

      - uses: actions/download-artifact@v4
        with:
          name: artifact
          path: artifacts

      - name: Parse info generated in preparation job
        id: info
        run: echo "new_version=$(cat artifacts/new_version)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - run: npm ci
      - name: Cache native source and resource downloads
        uses: actions/cache@v4
        with:
          path: .cache
          key: native-downloads-libraw-0.22.2-exiftool-13.59-${{ runner.os }}
      - run: npm run sync:resources

      - name: Set release version
        env:
          VERSION: ${{ steps.info.outputs.new_version }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit(f"Invalid release version: {version!r}")
          config = Path("src-tauri/tauri.conf.json")
          data = json.loads(config.read_text())
          data["version"] = version
          config.write_text(json.dumps(data, indent=2) + "\n")
          for filename, pattern in (
              ("Cargo.toml", r'(\[package\]\s+name = "x3fuse"\s+version = ")[^"]+'),
              ("Cargo.lock", r'(name = "x3fuse"\s+version = ")[^"]+'),
          ):
              path = Path("src-tauri") / filename
              updated, count = re.subn(pattern, lambda match: match[1] + version, path.read_text())
              if count != 1:
                  raise SystemExit(f"Expected one app version in {path}, found {count}")
              path.write_text(updated)
          PYTHON
          npm version --no-git-tag-version --allow-same-version --ignore-scripts "$VERSION"

      - name: Build, sign, and notarize macOS release
        env:
          APPLE_CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: Developer ID Application
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          : "${APPLE_CERTIFICATE:?Missing BUILD_CERTIFICATE_BASE64}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing P12_PASSWORD}"
          : "${APPLE_API_KEY_BASE64:?Missing APPLE_API_KEY_BASE64}"
          : "${APPLE_API_KEY:?Missing APPLE_API_KEY_ID}"
          : "${APPLE_API_ISSUER:?Missing APPLE_API_ISSUER_ID}"
          : "${TAURI_SIGNING_PRIVATE_KEY:?Missing TAURI_SIGNING_PRIVATE_KEY}"
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/x3fuse-notary.p8"
          trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
          (umask 077; printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$APPLE_API_KEY_PATH")
          npm run tauri -- build --target universal-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Verify universal binary
        run: |
          architectures=$(lipo -info src-tauri/target/universal-apple-darwin/release/bundle/macos/X3Fuse.app/Contents/MacOS/x3fuse)
          printf '%s\n' "$architectures"
          if [[ "$architectures" != *x86_64* || "$architectures" != *arm64* ]]; then
            echo "ERROR: App must contain both x86_64 and arm64."
            exit 1
          fi

      - name: Create release archives
        run: |
          mkdir Release
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          # ditto preserves the app symlinks required by its code signature.
          ditto -c -k --keepParent X3Fuse.app "$GITHUB_WORKSPACE/Release/X3Fuse-App.zip"
          cp X3Fuse.app.tar.gz X3Fuse.app.tar.gz.sig "$GITHUB_WORKSPACE/Release/"
          test -s "$GITHUB_WORKSPACE/Release/X3Fuse.app.tar.gz.sig"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app
          if-no-files-found: error
          path: |
            Release/X3Fuse-App.zip
            Release/X3Fuse.app.tar.gz
            Release/X3Fuse.app.tar.gz.sig

      - name: Upload release versions
        uses: actions/upload-artifact@v4
        with:
          name: version-files
          if-no-files-found: error
          path: |
            src-tauri/tauri.conf.json
            package.json
            package-lock.json
            src-tauri/Cargo.toml
            src-tauri/Cargo.lock

  release:
    name: "Create Release"
    runs-on: macos-26
    needs: archive
    outputs:
      new_version: ${{ steps.info.outputs.new_version }}
      sha256: ${{ steps.sha.outputs.sha256 }}
    steps:
      - uses: xt0rted/pull-request-comment-branch@v1
        id: comment-branch

      - uses: actions/checkout@v5
        if: success()
        with:
          ref: ${{ steps.comment-branch.outputs.head_ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Parse info generated in preparation job
        id: info
        run: |
          # Check both possible locations for artifact files
          if [ -f "artifacts/new_version" ]; then
            echo "new_version=$(cat artifacts/new_version)" >> "$GITHUB_OUTPUT"
            echo "title=$(cat artifacts/title)" >> "$GITHUB_OUTPUT"
            mv artifacts/new_version new_version
            mv artifacts/title title
            mv artifacts/latest_changes latest_changes
          elif [ -f "artifacts/artifact/new_version" ]; then
            echo "new_version=$(cat artifacts/artifact/new_version)" >> "$GITHUB_OUTPUT"
            echo "title=$(cat artifacts/artifact/title)" >> "$GITHUB_OUTPUT"
            mv artifacts/artifact/new_version new_version
            mv artifacts/artifact/title title
            mv artifacts/artifact/latest_changes latest_changes
          else
            echo "ERROR: Could not find artifact files in expected locations"
            exit 1
          fi

          mkdir Release
          mv artifacts/app/X3Fuse-App.zip Release/
          mv artifacts/app/X3Fuse.app.tar.gz artifacts/app/X3Fuse.app.tar.gz.sig Release/
          cp artifacts/version-files/package.json artifacts/version-files/package-lock.json .
          cp artifacts/version-files/src-tauri/tauri.conf.json artifacts/version-files/src-tauri/Cargo.toml artifacts/version-files/src-tauri/Cargo.lock src-tauri/

      - name: Compute app sha256
        id: sha
        run: echo "sha256=$(shasum -a 256 Release/X3Fuse-App.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Prepare Sparkle update creation
        run: |
          # Clean up Release directory
          rm -rf Release/*.log
          rm -rf Release/*.plist

          # List Release directory contents
          echo "Release directory contents:"
          ls -la Release/

      - name: Setup Sparkle
        if: steps.info.outputs.new_version == '0.2.0'
        run: |
          # Download Sparkle
          curl -L -o Sparkle.tar.xz https://github.com/sparkle-project/Sparkle/releases/download/2.7.1/Sparkle-2.7.1.tar.xz
          tar -xf Sparkle.tar.xz

      - name: Update appcast
        if: steps.info.outputs.new_version == '0.2.0'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Create a temporary directory for appcast generation
          mkdir -p appcast_temp
          cp Release/X3Fuse-App.zip appcast_temp/

          # Generate appcast using the zip file with the private key file
          echo "$SPARKLE_PRIVATE_KEY" | ./bin/generate_appcast --ed-key-file - --link "https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/releases" --download-url-prefix "https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/releases/download/v${{ steps.info.outputs.new_version }}/" -o docs/Support/appcast.xml appcast_temp/

          # Clean up temporary directory and key file
          rm -rf appcast_temp

      - name: Embed release notes in appcast
        if: steps.info.outputs.new_version == '0.2.0'
        run: |
          # generate_appcast omits release notes, so the Sparkle update window's
          # notes pane would be blank. Backfill each item's <description> from
          # Release_Notes.md so users can read what changed before updating.
          python3 Configuration/inject_release_notes.py

      - name: Write Tauri updater metadata
        env:
          VERSION: ${{ steps.info.outputs.new_version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          jq -n \
            --arg version "$VERSION" \
            --rawfile notes latest_changes \
            --arg pub_date "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --arg url "https://github.com/$REPOSITORY/releases/download/v$VERSION/X3Fuse.app.tar.gz" \
            --arg signature "$(cat Release/X3Fuse.app.tar.gz.sig)" \
            '{version: $version, notes: $notes, pub_date: $pub_date,
              platforms: (["darwin-universal", "darwin-aarch64", "darwin-x86_64"] |
                map({key: ., value: {url: $url, signature: $signature}}) | from_entries)}' \
            > docs/Support/latest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.info.outputs.new_version }} - ${{ steps.info.outputs.title }}
          tag_name: v${{ steps.info.outputs.new_version }}
          target_commitish: ${{ steps.comment-branch.outputs.head_ref }}
          fail_on_unmatched_files: true
          body_path: latest_changes
          files: |
            Release/X3Fuse-App.zip
            Release/X3Fuse.app.tar.gz
            Release/X3Fuse.app.tar.gz.sig

      - name: Saving changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          file_pattern: |
            docs/Support/appcast.xml
            docs/Support/latest.json
            src-tauri/tauri.conf.json
            package.json
            package-lock.json
            src-tauri/Cargo.toml
            src-tauri/Cargo.lock
          commit_message: "chore(release): bump version to v${{ steps.info.outputs.new_version }}"

      - name: Create summary
        run: |
          echo "Release v${{ steps.info.outputs.new_version }} created." > "$GITHUB_STEP_SUMMARY"

  homebrew:
    name: Update Homebrew cask
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout tap
        uses: actions/checkout@v5
        with:
          repository: sagwaco/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Bump cask version and sha256
        env:
          VERSION: ${{ needs.release.outputs.new_version }}
          SHA: ${{ needs.release.outputs.sha256 }}
        run: |
          CASK="Casks/x3fuse.rb"
          sed -i -E "s/^  version \"[^\"]*\"/  version \"$VERSION\"/" "$CASK"
          sed -i -E "s/^  sha256 \"[^\"]*\"/  sha256 \"$SHA\"/" "$CASK"
          echo "----- updated cask -----"
          cat "$CASK"

      - name: Commit and push
        env:
          VERSION: ${{ needs.release.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/x3fuse.rb
          git commit -m "x3fuse $VERSION" || { echo "No changes to commit"; exit 0; }
          git push

  ending:
    name: Ending job
    if: ${{ always() && github.event.issue.pull_request != null && contains(github.event.comment.body, '/release') }}
    runs-on: ubuntu-latest
    needs: [preparation, archive, release]
    steps:
      - uses: xt0rted/pull-request-comment-branch@v1
        id: comment-branch

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.comment-branch.outputs.head_ref }}

      - name: Merge PR
        if: ${{ needs.preparation.result == 'success' && needs.archive.result == 'success' && needs.release.result == 'success' }}
        uses: devmasx/merge-branch@master
        with:
          type: now
          from_branch: ${{ steps.comment-branch.outputs.head_ref }}
          target_branch: ${{ steps.comment-branch.outputs.base_ref }}
          github_token: ${{ github.token }}
          message: "Release version v${{ needs.release.outputs.new_version }}"

      - uses: geekyeggo/delete-artifact@v5
        with:
          name: "*"
          failOnError: false

      - name: Add success reactions
        if: ${{ contains(join(needs.*.result, ','), 'success') }}
        uses: peter-evans/create-or-update-comment@v2
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: rocket

      - name: Add negative reaction
        if: ${{ contains(join(needs.*.result, ','), 'failure') }}
        uses: peter-evans/create-or-update-comment@v2
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: confused
